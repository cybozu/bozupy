[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bozupy"
version = "0.6.1"
authors = [
    {name="SirTeaBear", email="sirteabear@gmail.com"}
]
description = "**Unofficial**: cybozu.com(kintone,Garoon,common) Python SDK"
requires-python = ">=3.14.0"
dependencies = [
    "boto3>=1.43.6",
    "lxml>=6.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
test = [
    "certifi==2026.10.19",
    "flake8>=7.3.0",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "responses>=0.26.0",
    "types-pyyaml>=6.0.12.20260508",
    "types-requests>=2.33.0.20260508",
]

# パッケージは Takumi Guard から取る。CI の setup-takumi-guard-pypi は PIP_INDEX_URL しか設定せず uv はそれを読まないので、
# ここに書いておかないと lock が pypi.org を向き、CI も Guard を通らなくなる
[[tool.uv.index]]
name = "takumi-guard"
url = "https://pypi.flatt.tech/simple/"
default = true

# eMudhra の中間 CA 鍵漏洩への対応: certifi 2026.10.19 が Takumi Guard に届くまで、certifi だけ PyPI から直接取る(例外として許可済み)。
# Guard に届いたら、この index と sources の certifi、test グループの certifi の固定を外して Guard 経由に戻す
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
certifi = { index = "pypi" }
